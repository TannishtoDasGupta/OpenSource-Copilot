services:
  - type: web
    name: opensource-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-dev.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: GITHUB_TOKEN
        sync: false
